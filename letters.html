<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jungle Letters</title>
<style>
:root{--bg:#fff6e0;--card:#ffffff;--ink:#2b2250;--mute:#6b6490;--a:#ff7a3d;--b:#2bb673;--c:#6c5ce7;--back:#6c5ce7;--shadow:#e3d6b4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1840;--card:#2b2458;--ink:#fff3d6;--mute:#b9b2e0;--back:#8b7cff;--shadow:#120f2b}}
:root[data-theme="dark"]{--bg:#1d1840;--card:#2b2458;--ink:#fff3d6;--mute:#b9b2e0;--back:#8b7cff;--shadow:#120f2b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Cairo","Tajawal","Segoe UI",Tahoma,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:520px;padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
h1{font-size:2.4rem;margin:8px 0 0;text-align:center;font-weight:900}
.sub{text-align:center;color:var(--mute);margin:0}
.btn{border:0;border-radius:22px;padding:18px;font:inherit;font-size:1.3rem;font-weight:800;color:#fff;background:var(--a);box-shadow:0 6px 0 var(--shadow);cursor:pointer;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
.btn.g{background:var(--b)}.btn.p{background:var(--c)}
.btn.s{background:var(--card);color:var(--ink);font-size:1rem;padding:10px 16px;width:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stat{font-weight:800;font-size:1.1rem}
.grid{display:grid;gap:10px;grid-template-columns:repeat(4,1fr)}
.card{aspect-ratio:3/4;perspective:600px;border:0;background:none;padding:0;cursor:pointer}
.in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.card.f .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--shadow)}
.front{background:var(--back);color:#fff;font-size:2rem}
.back{background:var(--card);transform:rotateY(180deg);font-size:2.4rem;font-weight:900}
.back small{font-size:.8rem;color:var(--mute);font-weight:700}
.card.ok .back{background:#c8f5dc;color:#0b5a35}
.card.ok .back small{color:#0b5a35}
.langs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.langs button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:8px 12px;background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--shadow);cursor:pointer}.langs .on{background:var(--c);color:#fff}
.back.sm{font-size:1rem;padding:4px;text-align:center;line-height:1.2;overflow:hidden}.back.sm small{font-size:.75rem}.nq{font-size:2.4rem;line-height:1.3;word-break:break-all}
.q{background:var(--card);border-radius:28px;padding:24px;text-align:center;font-size:6rem;box-shadow:0 6px 0 var(--shadow)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opt{font:inherit;font-size:2.6rem;font-weight:900;padding:18px 0;border:0;border-radius:20px;background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--shadow);cursor:pointer}
.opt.good{background:#c8f5dc;color:#0b5a35}.opt.bad{background:#ffd1d1;color:#7a1414}
.bar{height:12px;border-radius:8px;background:var(--shadow);overflow:hidden}
.bar i{display:block;height:100%;background:var(--b);transition:width .3s}
.win{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.stars{font-size:3.4rem}
.btn.s{min-height:48px}button:focus-visible,a:focus-visible{outline:4px solid var(--a);outline-offset:2px}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lv button{font:inherit;font-weight:800;font-size:1.2rem;padding:14px 0;border-radius:16px;border:0;background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--shadow);cursor:pointer}
.lv small{display:block;font-size:.8rem}
@media (prefers-reduced-motion:reduce){.in{transition:none}}
</style>
<meta name="theme-color" content="#6c5ce7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Jungle Letters"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div id="app"></div>
<script>
const L={
ar:{n:"عربي",dir:"rtl",sp:"ar-SA",title:"حروف الغابة",sub:"تعلّم الحروف باللعب",stars:"نجومك",mem:"لعبة الذاكرة",qz:"أي حرف هذا؟",off:"تعمل بدون إنترنت بعد فتحها أول مرة",lv:"اختر المستوى",mv:"حركات",gr:"أحسنت!",done:"أنهيت المستوى في {n} حركة",nx:"المستوى التالي",again:"إعادة",menu:"القائمة",res:"النتيجة",pl:"العب مرة أخرى",st:"{w} تبدأ بحرف…",
d:[["أ","أرنب","🐰"],["ب","بطة","🦆"],["ت","تفاحة","🍎"],["ث","ثعلب","🦊"],["ج","جمل","🐪"],["ح","حصان","🐴"],["د","دب","🐻"],["ز","زرافة","🦒"],["س","سمكة","🐟"],["ف","فيل","🐘"],["ق","قرد","🐒"],["ن","نحلة","🐝"],["ع","عنب","🍇"],["ك","كلب","🐶"],["م","موزة","🍌"],["ش","شمس","☀️"]]},
en:{n:"English",dir:"ltr",sp:"en-US",title:"Jungle Letters",sub:"Learn letters by playing",stars:"Your stars",mem:"Memory game",qz:"Which letter?",off:"Works offline after the first load",lv:"Choose a level",mv:"Moves",gr:"Well done!",done:"You finished in {n} moves",nx:"Next level",again:"Replay",menu:"Menu",res:"Score",pl:"Play again",st:"{w} starts with…",
d:[["A","Apple","🍎"],["B","Bear","🐻"],["C","Cat","🐱"],["D","Dog","🐶"],["E","Elephant","🐘"],["F","Fish","🐟"],["G","Giraffe","🦒"],["H","Horse","🐴"],["L","Lion","🦁"],["M","Monkey","🐒"],["O","Owl","🦉"],["P","Penguin","🐧"],["R","Rabbit","🐰"],["S","Sun","☀️"],["T","Tiger","🐯"],["W","Whale","🐳"]]},
fr:{n:"Français",dir:"ltr",sp:"fr-FR",title:"Lettres de la jungle",sub:"Apprends les lettres en jouant",stars:"Tes étoiles",mem:"Jeu de mémoire",qz:"Quelle lettre ?",off:"Fonctionne hors ligne après le premier chargement",lv:"Choisis un niveau",mv:"Coups",gr:"Bravo !",done:"Tu as terminé en {n} coups",nx:"Niveau suivant",again:"Rejouer",menu:"Menu",res:"Score",pl:"Rejouer",st:"{w} commence par…",
d:[["A","Abeille","🐝"],["B","Banane","🍌"],["C","Chat","🐱"],["D","Dauphin","🐬"],["E","Escargot","🐌"],["F","Fraise","🍓"],["G","Girafe","🦒"],["H","Hibou","🦉"],["L","Lion","🦁"],["M","Mouton","🐑"],["O","Ours","🐻"],["P","Poisson","🐟"],["R","Renard","🦊"],["S","Soleil","☀️"],["T","Tigre","🐯"],["Z","Zèbre","🦓"]]},
es:{n:"Español",dir:"ltr",sp:"es-ES",title:"Letras de la selva",sub:"Aprende las letras jugando",stars:"Tus estrellas",mem:"Juego de memoria",qz:"¿Qué letra es?",off:"Funciona sin conexión tras la primera carga",lv:"Elige un nivel",mv:"Movimientos",gr:"¡Muy bien!",done:"Terminaste en {n} movimientos",nx:"Siguiente nivel",again:"Repetir",menu:"Menú",res:"Puntos",pl:"Jugar otra vez",st:"{w} empieza con…",
d:[["A","Abeja","🐝"],["B","Ballena","🐳"],["C","Caballo","🐴"],["D","Delfín","🐬"],["E","Elefante","🐘"],["F","Fresa","🍓"],["G","Gato","🐱"],["H","Hormiga","🐜"],["J","Jirafa","🦒"],["L","León","🦁"],["M","Mono","🐒"],["O","Oso","🐻"],["P","Perro","🐶"],["R","Rana","🐸"],["S","Sol","☀️"],["T","Tigre","🐯"]]}
};
const NW={ar:["واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة","عشرة"],en:["One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten"],fr:["Un","Deux","Trois","Quatre","Cinq","Six","Sept","Huit","Neuf","Dix"],es:["Uno","Dos","Tres","Cuatro","Cinco","Seis","Siete","Ocho","Nueve","Diez"]};
const X={ar:{pl1:"حروف",pl2:"أرقام",cn:"كم عدد التفاح؟",inst:"ثبّت اللعبة",ios:"في سفاري: اضغط مشاركة ثم «إضافة إلى الشاشة الرئيسية»"},
en:{pl1:"Letters",pl2:"Numbers",cn:"How many apples?",inst:"Install the game",ios:"In Safari: tap Share, then “Add to Home Screen”"},
fr:{pl1:"Lettres",pl2:"Chiffres",cn:"Combien de pommes ?",inst:"Installer le jeu",ios:"Dans Safari : Partager, puis « Sur l’écran d’accueil »"},
es:{pl1:"Letras",pl2:"Números",cn:"¿Cuántas manzanas?",inst:"Instalar el juego",ios:"En Safari: Compartir y «Añadir a pantalla de inicio»"}};
Object.keys(X).forEach(c=>Object.assign(L[c],X[c]));
function setD(){D=save.pack==="n"?NW[save.lang].map((w,i)=>[save.lang==="ar"?String(i+1).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]):String(i+1),w,"🍎".repeat(i+1)]):T.d}
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);let dp;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;const b=document.getElementById("ins");if(b)b.style.display="block"});
const NV={ar:{main:"اللعبة الرئيسية",mainL:"العودة إلى اللعبة الرئيسية",upd:"تحديث اللعبة",rst:"إعادة",bk:"رجوع",nooff:"يلزم اتصال بالإنترنت للتحديث.",ing:"جارٍ التحديث…",fail:"تعذّر التحديث الآن. تقدّمك محفوظ."},
en:{main:"Main game",mainL:"Back to the main game",upd:"Update game",rst:"Restart",bk:"Back",nooff:"An internet connection is needed to update.",ing:"Updating…",fail:"Update failed. Your progress is safe."},
fr:{main:"Jeu principal",mainL:"Retour au jeu principal",upd:"Mettre à jour",rst:"Recommencer",bk:"Retour",nooff:"Une connexion Internet est nécessaire.",ing:"Mise à jour…",fail:"Échec de la mise à jour. Ta progression est conservée."},
es:{main:"Juego principal",mainL:"Volver al juego principal",upd:"Actualizar",rst:"Reiniciar",bk:"Atrás",nooff:"Se necesita conexión a Internet para actualizar.",ing:"Actualizando…",fail:"No se pudo actualizar. Tu progreso está a salvo."}};
Object.keys(NV).forEach(c=>Object.assign(L[c],NV[c]));
let tok=0;
function toMain(){
 try{const rf=document.referrer;if(rf&&history.length>1){const u=new URL(rf);if(u.origin===location.origin&&/\/(index\.html)?$/.test(u.pathname)){history.back();return}}}catch(e){}
 location.replace("./index.html")}
async function upd(){
 const t=document.getElementById("toast"),m=x=>{if(t)t.textContent=x};
 if(!navigator.onLine){m(T.nooff);return}
 m(T.ing);
 try{const f=await fetch(location.href.split("#")[0],{cache:"no-store"});if(!f.ok)throw 0;
  if("serviceWorker" in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(x=>x.update()))}
  if(window.caches){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}
  location.reload()}catch(e){m(T.fail)}}
const LV=[3,4,6,8];
const $=document.getElementById("app");
let save={};try{save=JSON.parse(localStorage.getItem("huroof")||"{}")}catch(e){}
if(!L[save.lang]){const n=(navigator.language||"ar").slice(0,2);save.lang=L[n]?n:"ar"}
let T,D;
function setLang(c){save.lang=c;persist();T=L[c];setD();document.documentElement.lang=c;document.documentElement.dir=T.dir;document.title=T.title}
function persist(){try{localStorage.setItem("huroof",JSON.stringify(save))}catch(e){}}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let ac;
function tone(f,d=.12,t="sine"){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
const good=()=>{tone(660);setTimeout(()=>tone(880),110)},bad=()=>tone(200,.25,"square");
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=T.sp;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const key=k=>save.lang+(save.pack==="n"?"n":"")+k;
function menu(){
 tok++;
 const total=Object.entries(save).filter(([k,v])=>typeof v==="number").reduce((a,[,v])=>a+v,0);
 $.innerHTML=`<div class="top"><button class="btn s" id="hm" aria-label="${T.mainL}">🏠 ${T.main}</button></div><div class="langs">${Object.keys(L).map(c=>`<button class="${c===save.lang?"on":""}" data-c="${c}">${L[c].n}</button>`).join("")}</div>
 <h1>🦁 ${T.title}</h1><p class="sub">${T.sub} · ${T.stars}: ⭐ ${total}</p>
 <div class="langs packs"><button class="${save.pack!=="n"?"on":""}" data-p="l">🔤 ${T.pl1}</button><button class="${save.pack==="n"?"on":""}" data-p="n">🔢 ${T.pl2}</button></div>
 <button class="btn" id="m">🃏 ${T.mem}</button>
 <button class="btn g" id="z">❓ ${T.qz}</button>
 <button class="btn s" id="ins" style="display:${dp||isIOS?"block":"none"};margin:0 auto">📲 ${T.inst}</button><button class="btn s" id="up" style="width:100%">🔄 ${T.upd}</button><p class="sub">${T.off}</p><p class="sub" id="toast"></p>`;
 document.getElementById("m").onclick=levels;document.getElementById("z").onclick=quiz;
 document.querySelectorAll("button[data-c]").forEach(b=>b.onclick=()=>{setLang(b.dataset.c);menu()});
 document.querySelectorAll("button[data-p]").forEach(b=>b.onclick=()=>{save.pack=b.dataset.p;persist();setD();menu()});
 document.getElementById("ins").onclick=()=>dp?dp.prompt():alert(T.ios);
 document.getElementById("hm").onclick=toMain;document.getElementById("up").onclick=upd;
}
function levels(){
 tok++;
 $.innerHTML=`<div class="top"><button class="btn s" id="h" aria-label="${T.bk}">↩</button><button class="btn s" id="hm" aria-label="${T.mainL}">🏠</button><span class="stat">${T.lv}</span></div><div class="lv" id="lv"></div>`;
 document.getElementById("h").onclick=menu;document.getElementById("hm").onclick=toMain;
 LV.forEach((n,i)=>{const s=save[key("m"+i)]||0;const b=document.createElement("button");b.innerHTML=`${i+1}<small>${"⭐".repeat(s)||"—"}</small>`;b.onclick=()=>memory(i);document.getElementById("lv").appendChild(b)});
}
function memory(i){
 const my=++tok;
 const n=LV[i],pick=shuffle(D).slice(0,n);
 let cards=[];pick.forEach(p=>{cards.push({k:p[0],t:"l",p});cards.push({k:p[0],t:"i",p})});cards=shuffle(cards);
 let open=[],moves=0,found=0,lock=false;
 $.innerHTML=`<div class="top"><button class="btn s" id="h" aria-label="${T.bk}">↩</button><button class="btn s" id="hm" aria-label="${T.mainL}">🏠</button><span class="stat" id="mv">${T.mv}: 0</span><button class="btn s" id="rs" aria-label="${T.rst}">🔄</button></div><div class="bar"><i id="pr" style="width:0"></i></div><div class="grid" id="g"></div>`;
 document.getElementById("h").onclick=levels;document.getElementById("hm").onclick=toMain;document.getElementById("rs").onclick=()=>memory(i);
 const g=document.getElementById("g");
 cards.forEach(c=>{const el=document.createElement("button");el.className="card";
  el.innerHTML=`<div class="in"><div class="face front">🌴</div><div class="face back${c.t==="i"&&c.p[2].length>3?" sm":""}">${c.t==="l"?c.p[0]:c.p[2]}<small>${c.t==="l"?"":c.p[1]}</small></div></div>`;
  el.onclick=()=>{if(lock||el.classList.contains("f"))return;el.classList.add("f");tone(440,.08);open.push([c,el]);
   if(open.length===2){moves++;document.getElementById("mv").textContent=T.mv+": "+moves;lock=true;
    const[[a,ea],[b,eb]]=open;open=[];
    if(a.k===b.k){setTimeout(()=>{if(my!==tok)return;ea.classList.add("ok");eb.classList.add("ok");good();say(a.p[0]+" … "+a.p[1]);found++;document.getElementById("pr").style.width=found/n*100+"%";lock=false;if(found===n)setTimeout(()=>{if(my===tok)win(i,moves)},900)},400)}
    else setTimeout(()=>{if(my!==tok)return;ea.classList.remove("f");eb.classList.remove("f");lock=false},800)}};
  g.appendChild(el)});
}
function win(i,moves){
 const n=LV[i],s=moves<=n+2?3:moves<=n*2?2:1;
 save[key("m"+i)]=Math.max(save[key("m"+i)]||0,s);persist();good();
 $.innerHTML=`<div class="win"><h1>🎉 ${T.gr}</h1><div class="stars">${"⭐".repeat(s)}</div><p class="sub">${T.done.replace("{n}",moves)}</p>
 <button class="btn g" id="nx">${i<LV.length-1?T.nx:T.again}</button><button class="btn p" id="lv">${T.menu}</button><button class="btn s" id="hm" aria-label="${T.mainL}">🏠 ${T.main}</button></div>`;
 document.getElementById("nx").onclick=()=>memory(i<LV.length-1?i+1:0);document.getElementById("lv").onclick=levels;document.getElementById("hm").onclick=toMain;
}
function quiz(){
 const my=++tok;
 const qs=shuffle(D).slice(0,10);let k=0,sc=0;
 function show(){
  if(k>=qs.length){const s=sc>=9?3:sc>=6?2:1;save[key("quiz")]=Math.max(save[key("quiz")]||0,s);persist();
   $.innerHTML=`<div class="win"><h1>🏆 ${T.res} ${sc}/10</h1><div class="stars">${"⭐".repeat(s)}</div><button class="btn g" id="a">${T.pl}</button><button class="btn p" id="b">${T.menu}</button><button class="btn s" id="hm" aria-label="${T.mainL}">🏠 ${T.main}</button></div>`;
   document.getElementById("a").onclick=quiz;document.getElementById("b").onclick=menu;document.getElementById("hm").onclick=toMain;return}
  const q=qs[k],ch=shuffle([q,...shuffle(D.filter(d=>d!==q)).slice(0,2)]);
  $.innerHTML=`<div class="top"><button class="btn s" id="h" aria-label="${T.bk}">↩</button><button class="btn s" id="hm" aria-label="${T.mainL}">🏠</button><span class="stat">${k+1}/10</span><button class="btn s" id="rs" aria-label="${T.rst}">🔄</button></div><div class="bar"><i style="width:${k*10}%"></i></div>
  <div class="q${save.pack==="n"?" nq":""}" id="q">${q[2]}</div><p class="sub">${save.pack==="n"?T.cn:T.st.replace("{w}",q[1])}</p><div class="opts" id="o"></div>`;
  document.getElementById("h").onclick=menu;document.getElementById("hm").onclick=toMain;document.getElementById("rs").onclick=quiz;document.getElementById("q").onclick=()=>say(q[1]);if(save.pack!=="n")say(q[1]);
  ch.forEach(c=>{const b=document.createElement("button");b.className="opt";b.textContent=c[0];
   b.onclick=()=>{document.querySelectorAll(".opt").forEach(x=>x.onclick=null);
    if(c===q){b.classList.add("good");sc++;good()}else{b.classList.add("bad");bad();[...document.querySelectorAll(".opt")].find(x=>x.textContent===q[0]).classList.add("good")}
    setTimeout(()=>{if(my===tok){k++;show()}},1100)};
   document.getElementById("o").appendChild(b)});
 }
 show();
}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
setLang(save.lang);menu();
</script>
</body>
</html>
