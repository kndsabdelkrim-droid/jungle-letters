<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jungle Letters · الغابة الناطقة</title>
<meta name="theme-color" content="#2a9d5c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eaf7e0;--card:#fff;--ink:#1f3a28;--mute:#5d7a66;--g:#2a9d5c;--o:#f4a100;--br:#8d5a2b;--sh:#c9dcb8;--ok:#c8f5dc;--no:#ffe3c2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10251a;--card:#1b3a29;--ink:#eaf7e0;--mute:#a6c4b0;--sh:#0a1a11;--ok:#1d5a3a;--no:#5a3d17}}
:root[data-theme="dark"]{--bg:#10251a;--card:#1b3a29;--ink:#eaf7e0;--mute:#a6c4b0;--sh:#0a1a11;--ok:#1d5a3a;--no:#5a3d17}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Cairo","Tajawal","Segoe UI",Tahoma,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:560px;padding:14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
h1{font-size:1.9rem;margin:4px 0;text-align:center;font-weight:900;line-height:1.25}
.sub{text-align:center;color:var(--mute);margin:0;font-size:1rem}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block}
button{font:inherit;color:inherit}
button:focus-visible,summary:focus-visible{outline:4px solid var(--o);outline-offset:2px}
.btn{border:0;border-radius:20px;padding:16px;font-size:1.2rem;font-weight:800;color:#fff;background:var(--g);box-shadow:0 5px 0 var(--sh);cursor:pointer;width:100%;min-height:56px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sh)}
.btn.o{background:var(--o);color:#3a2600}.btn.s{background:var(--card);color:var(--ink);width:auto;padding:10px 16px;font-size:1.1rem;min-height:48px}
.top{display:flex;align-items:center;gap:10px}.top .bar{flex:1}
.bar{height:12px;border-radius:8px;background:var(--sh);overflow:hidden}.bar i{display:block;height:100%;background:var(--g);transition:width .3s}
.stat{font-weight:800}
.kiki{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:20px;padding:12px;box-shadow:0 4px 0 var(--sh)}
.kiki .av{font-size:2.6rem;line-height:1}
.reg{display:flex;align-items:center;gap:12px;text-align:start;background:var(--card);color:var(--ink);border:0;border-radius:22px;padding:14px;box-shadow:0 5px 0 var(--sh);width:100%;cursor:pointer;min-height:84px}
.reg .ic{font-size:2.4rem}.reg b{font-size:1.15rem;display:block}.reg small{color:var(--mute)}
.reg[aria-disabled="true"]{opacity:.55}
.q{background:var(--card);border:0;border-radius:26px;padding:18px;text-align:center;font-size:5.5rem;box-shadow:0 5px 0 var(--sh);width:100%}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{border:0;border-radius:18px;background:var(--card);padding:16px 4px;font-size:1.35rem;font-weight:800;box-shadow:0 4px 0 var(--sh);cursor:pointer;min-height:64px}
.emo .opt{font-size:2.8rem}
.opt.good{background:var(--ok)}.opt.bad{background:var(--no)}.opt[disabled]{opacity:.45}
.slots{display:flex;justify-content:center;gap:6px;font-size:2rem;font-weight:900;letter-spacing:2px;direction:ltr}
.slots b{min-width:1.3em;border-bottom:4px solid var(--g);text-align:center}
.fb{border-radius:18px;padding:12px;text-align:center;line-height:1.7}.fb.good{background:var(--ok)}.fb.bad{background:var(--no)}
.shake{animation:sk .3s}@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.stars{font-size:3rem;text-align:center}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{background:var(--card);border-radius:14px;padding:8px 2px;text-align:center;font-size:.8rem;box-shadow:0 3px 0 var(--sh)}.cell span{display:block;font-size:1.8rem}
.cell.m{background:var(--ok)}
details{background:var(--card);border-radius:16px;padding:12px;line-height:1.8}
summary{font-weight:800;cursor:pointer;min-height:32px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const LET=true;const VER="2.3";
const RN=[["درب الحيوانات","🐾"],["نهر الكلمات","🌊"],["معبد الكنز","🏛️"]];
const EA="🐱 🐶 🦁 🐵 🐘 🐰 🐟 🐦".split(" "),EF="🍎 🍌 🍇 🍋 🍊 🍓 🍉 🍒".split(" "),AA="قطة كلب أسد قرد فيل أرنب سمكة طائر".split(" "),AF="تفاحة موزة عنب ليمون برتقالة فراولة بطيخ كرز".split(" ");
const sp=x=>x.split(" "),mk=(w,p,A,E)=>sp(w).map((x,i)=>[x,A[i],E[i],sp(p)[i]]);
const DATA={
en:[mk("cat dog lion monkey elephant rabbit fish bird","كات دوغ لايون مانكي إليفانت رابِت فيش بيرد",AA,EA),mk("apple banana grape lemon orange strawberry watermelon cherry","آبل بانانا غريب ليمن أورنج ستروبيري واترميلن تشيري",AF,EF)],
fr:[mk("chat chien lion singe éléphant lapin poisson oiseau","شا شيان ليّون سانج إيليفون لابان بواسون واذو",AA,EA),mk("pomme banane raisin citron orange fraise pastèque cerise","بوم بانان ريزان سيترون أورونج فريز باستيك سريز",AF,EF)],
es:[mk("gato perro león mono elefante conejo pez pájaro","غاتو بيرو ليون مونو إليفانتي كونيخو بيس باخارو",AA,EA),mk("manzana plátano uva limón naranja fresa sandía cereza","مانثانا بلاتانو أوبا ليمون ناراخا فريسا ساندييا ثيريثا",AF,EF)]};
const LG={en:{n:"English",f:"🇬🇧",v:"en-US"},fr:{n:"Français",f:"🇫🇷",v:"fr-FR"},es:{n:"Español",f:"🇪🇸",v:"es-ES"}};
let R,W;
function setL(l){S.l=l;R=RN.map((r,i)=>({n:r[0],e:r[1],w:i<2?DATA[l][i]:null}));W=[...R[0].w,...R[1].w]}
const $=document.getElementById("app");
function load(){let o={};try{o=JSON.parse(localStorage.getItem("jl2")||"{}")}catch(e){}
 if(!o||typeof o!=="object"||Array.isArray(o))o={};
 const n=(v,mx=1e9)=>Number.isFinite(v)?Math.max(0,Math.min(mx,Math.floor(v))):0,w={};
 if(o.w&&typeof o.w==="object")Object.keys(o.w).forEach(k=>{const x=o.w[k];if(!/^(en|fr|es):.{1,30}$/.test(k)||!x||typeof x!=="object")return;w[k]={b:n(x.b,4),c:n(x.c),x:n(x.x!==undefined?x.x:x.m),t:n(x.t,4e12),lt:["pw","lp","sp"].includes(x.lt)?x.lt:""}});
 return{w,q:n(o.q),d:typeof o.d==="string"?o.d.slice(0,10):"",dq:n(o.dq,1000),lv:n(o.lv),mute:o.mute===true,intro:o.intro===true,l:["en","fr","es"].includes(o.l)?o.l:undefined}}
let S=load();
const save=()=>{try{localStorage.setItem("jl2",JSON.stringify(S))}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10);
const K=w=>S.l+":"+w[0];const bx=w=>(S.w[K(w)]||{}).b||0;
const cnt=(ws,m)=>ws.filter(w=>bx(w)>=m).length;
const att=w=>{const r=S.w[K(w)];return r?r.c+r.x:0};
const state=w=>bx(w)>=3?"m":att(w)>0?"l":"n";
const needsRev=w=>{const r=S.w[K(w)];return !!r&&((state(w)==="l"&&r.x>0)||(state(w)==="m"&&r.t>0&&Date.now()-r.t>3*864e5))};
const open=[()=>true,()=>cnt(R[0].w,2)>=4,()=>cnt(W,3)>=8];
const need=["","لفتح النهر: اجعل 4 حيوانات في مستوى «أتعلّمها» 🌳","لفتح المعبد: أتقن 8 كلمات ⭐"];
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const SP="speechSynthesis" in window;
const WV={};
function wav(f,d){const sr=16000,n=sr*d|0,b=new Uint8Array(44+n),dv=new DataView(b.buffer),ws=(o,t)=>[...t].forEach((c,i)=>dv.setUint8(o+i,c.charCodeAt(0)));ws(0,"RIFF");dv.setUint32(4,36+n,true);ws(8,"WAVEfmt ");dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);ws(36,"data");dv.setUint32(40,n,true);for(let i=0;i<n;i++)b[44+i]=128+Math.round(Math.sin(2*Math.PI*f*i/sr)*100*(1-i/n));let t="";b.forEach(x=>t+=String.fromCharCode(x));return "data:audio/wav;base64,"+btoa(t)}
function tone(f,d=.12){if(S.mute)return;try{const k=f+"_"+d,a=new Audio(WV[k]=WV[k]||wav(f,d));a.volume=1;const p=a.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
const good=()=>{tone(660);setTimeout(()=>tone(880),110)},bad=()=>tone(250,.2,"triangle");
let VO=[];function loadV(){try{VO=speechSynthesis.getVoices()||[]}catch(e){}}
if(SP){loadV();try{speechSynthesis.onvoiceschanged=loadV}catch(e){}}
const findV=()=>{const p=LG[S.l].v.slice(0,2);return VO.find(v=>v.lang.replace("_","-").toLowerCase().startsWith(p))};
const CAN=()=>SP&&!!findV();
function say(t){if(S.mute||!SP)return;try{if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=LG[S.l].v;const v=findV();if(v)u.voice=v;u.rate=.8;u.volume=1;setTimeout(()=>{try{speechSynthesis.resume();speechSynthesis.speak(u)}catch(e){}},80)}catch(e){}}
const h=s=>{$.innerHTML=s;$.scrollTop=0};
const ex=w=>S.l==="en"?`I see ${/^[aeiou]/.test(w[0])?"an":"a"} ${w[0]}.`:S.l==="fr"?`Je vois : ${w[0]}.`:`Veo: ${w[0]}.`;
const muteBtn=()=>`<button class="btn s" data-a="mute" aria-label="${S.mute?"تشغيل الصوت":"كتم الصوت"}">${S.mute?"🔇":"🔊"}</button>`;
const msgs=["مرحبًا يا مستكشف! أنا كيكي 🐵 هيا نتعلّم كلمات جديدة.","كل كلمة تتقنها تفتح لنا طريقًا في الغابة!","الأخطاء عادية، هكذا تنمو الشجرة 🌱"];
let Q=null;

function info(){return `<details open><summary>للأهل والمعلّمين</summary>يعلّم الأطفال (6–10 سنوات) كلمات مبتدئة (إنجليزية أو فرنسية أو إسبانية حسب اختيارهم) بالصور والاستماع والتهجئة، وتُعاد الكلمات الصعبة لاحقًا بتمرين مختلف. التعليمات والمعاني بالعربية، والكلمات باللغة المختارة.<br>يُحفظ التقدّم على هذا الجهاز فقط (لا يتزامن بين الأجهزة). لا حسابات ولا إعلانات ولا تتبّع، ولا نطلب أي بيانات شخصية.</details>`}
function langScreen(){Q=null;h(`<div class="top"><b style="flex:1;font-size:1.2rem">🧒🐵 <span class="en">Jungle Letters</span></b>${muteBtn()}</div><h1>ماذا تريد أن تتعلّم اليوم؟</h1><p class="sub">اختر لغة المغامرة</p>${Object.keys(LG).map(k=>`<button class="btn ${k===S.l?"o":""}" data-a="lang" data-v="${k}"><span aria-hidden="true">${LG[k].f}</span> <span class="en">${LG[k].n}</span></button>`).join("")}<p class="sub">الكلمات بلغتك المختارة والشرح بالعربية. يُحفظ تقدّم كل لغة على حدة.</p><button class="btn s" data-a="upd" style="width:100%">🔄 تحديث اللعبة</button><p class="sub" id="toast"></p><p class="sub">الإصدار ${VER}</p>`)}
function intro(){h(`<div class="top"><button class="btn s" data-a="langs" aria-label="رجوع لاختيار اللغة">↩</button></div><h1>🌴 Jungle Letters<br><small>الغابة الناطقة</small></h1><p class="sub">Learn a language. Unlock the Jungle!</p>
<div class="kiki"><span class="av" aria-hidden="true">🧒🐵</span><p>أنت مستكشف صغير، وكيكي القرد يرافقك. تعلّم الكلمات لتفتح أبواب الغابة واحدًا تلو الآخر!</p></div>${info()}
<button class="btn o" data-a="start">ابدأ المغامرة ▶</button>`)}
function home(){
 if(S.d!==today()){S.d=today();S.dq=0;save()}
 const mast=cnt(W,3),p=Math.min(10,S.dq);
 h(`<div class="top"><button class="btn s" data-a="langs" aria-label="تغيير اللغة">↩</button><b style="flex:1;font-size:1.2rem">${LG[S.l].f} <span class="en">Jungle Letters</span></b>${muteBtn()}</div>
 <div class="kiki"><span class="av" aria-hidden="true">🐵</span><p>${msgs[S.q%3]}</p></div>
 <div class="kiki" style="display:block"><b>🎯 مهمة اليوم: أجب عن 10 أسئلة ${p>=10?"— أنجزتها! 🏅":""}</b><div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemax="10"><i style="width:${p*10}%"></i></div></div>
 ${R.map((r,i)=>{const o=open[i]();return `<button class="reg" data-a="play" data-v="${i}" aria-disabled="${!o}"><span class="ic" aria-hidden="true">${o?r.e:"🔒"}</span><span><b>${r.n}</b><small>${o?(i===2?"مراجعة كل الكلمات":"8 كلمات: "+cnt(r.w,3)+" متقنة"):need[i]}</small></span></button>`}).join("")}
 <button class="btn o" data-a="map">📈 تقدّمي ومراجعة الكلمات (${mast}/${W.length} ⭐)</button>
 ${LET?'<a class="btn s" style="text-align:center;text-decoration:none;display:block" href="letters.html">🔤 لعبة الحروف (النسخة الأولى)</a>':""}
 <div style="display:flex;gap:8px"><button class="btn s" data-a="share" style="flex:1">📤 شارك اللعبة</button><button class="btn s" data-a="info" style="flex:1">ℹ️ للأهل</button></div><div style="display:flex;gap:8px"><button class="btn s" data-a="test" style="flex:1">🔈 اختبار الصوت</button><button class="btn s" data-a="upd" style="flex:1">🔄 تحديث اللعبة</button></div><p class="sub" id="toast"></p><p class="sub">الإصدار ${VER}</p>`)}
function map(){
 const n=W.filter(w=>state(w)==="n").length,l=W.filter(w=>state(w)==="l").length,m=W.filter(w=>state(w)==="m").length,rv=W.filter(needsRev).length;
 const pr=Math.round(W.reduce((a,w)=>a+Math.min(bx(w),3),0)/(W.length*3)*100);
 h(`<div class="top"><button class="btn s" data-a="home" aria-label="رجوع">↩</button><b>📈 تقدّمي</b></div>
 <div class="kiki" style="display:block"><b>التقدّم الكلي: ${pr}%</b><div class="bar" role="progressbar" aria-valuenow="${pr}" aria-valuemax="100"><i style="width:${pr}%"></i></div><p>🌱 جديدة: ${n} · 🌿 قيد التعلّم: ${l} · ⭐ متقنة: ${m}<br>🔁 تحتاج مراجعة: ${rv} · 🍃 أوراقك: ${S.lv}</p></div>
 ${rv?`<button class="btn o" data-a="play" data-v="r">🔁 راجع الكلمات الصعبة (${rv})</button>`:""}
 <div class="map">${W.map(w=>{const s=state(w),rr=S.w[K(w)]||{c:0,x:0};return `<div class="cell ${s==="m"?"m":""}"><span aria-hidden="true">${w[2]}</span><b class="en">${w[0]}</b><br>${{n:"🌱",l:"🌿",m:"⭐"}[s]}${needsRev(w)?" 🔁":""}<br><small>✔${rr.c} ✖${rr.x}</small></div>`}).join("")}</div>`)}
function pick(ri){
 const pool=ri===2?W:R[ri].w;
 return pool.map(w=>({w,p:bx(w)+Math.random()*1.5-((S.w[K(w)]||{}).x||0)*.3-(needsRev(w)?1.5:0)})).sort((a,b)=>a.p-b.p).slice(0,8).map(x=>x.w)}
function play(ri){
 if(ri==="r"){const L=sh(W.filter(needsRev)).slice(0,8);if(!L.length)return;Q={ri:2,rev:1,L,i:0,ok:0,imp:0,seen:{},req:{},c:null};return nextQ()}
 ri=+ri;if(!open[ri]()){toast(need[ri]);return}Q={ri,L:sh(pick(ri)),i:0,ok:0,imp:0,seen:{},req:{},c:null};nextQ()}
function nextQ(){if(Q.i>=Q.L.length)return end();const w=Q.L[Q.i];if(bx(w)===0&&!Q.seen[w[0]]){Q.seen[w[0]]=1;return card(w)}ask(w)}
function head(){return `<div class="top"><button class="btn s" data-a="quit" aria-label="خروج إلى الرئيسية">↩</button><button class="btn s" data-a="pause" aria-label="إيقاف مؤقت">⏸</button><div class="bar" role="progressbar" aria-valuenow="${Q.i}" aria-valuemax="${Q.L.length}"><i style="width:${Q.i/Q.L.length*100}%"></i></div><span class="stat">${Q.i+1}/${Q.L.length}</span></div>`}
function card(w){Q.c={w,card:1};h(head()+`<p class="sub">كلمة جديدة! 🌱</p><div class="q" aria-hidden="true">${w[2]}</div><h1 class="en" style="display:block">${w[0]}</h1><p class="sub">${w[1]} · 🗣️ النطق: ${w[3]}</p><p class="sub en" style="display:block;direction:ltr">${ex(w)}</p><button class="btn o" data-a="say" data-v="${w[0]}">🔊 استمع</button><button class="btn" data-a="go">فهمت ▶</button>`);setTimeout(()=>say(w[0]),300)}
function ask(w){
 const b=bx(w),short=w[0].length<=6,pool=Q.ri===2?W:R[Q.ri].w;
 const r0=S.w[K(w)]||{};let T=b<=0?["pw"]:b===1?["lp","pw"]:["sp","lp","pw"];
 T=T.filter(x=>(x!=="lp"||CAN())&&(x!=="sp"||short));if(!T.length)T=["pw"];
 const alt=T.filter(x=>x!==r0.lt),P=alt.length?alt:T,t=b>=3?P[Math.random()*P.length|0]:P[0];
 const opts=sh([w,...sh(pool.filter(x=>x!==w)).slice(0,2)]);
 Q.c={w,t,opts,mis:0,pos:0,done:false};
 let body;
 if(t==="pw")body=`<p class="sub">ما اسم هذه الصورة بالإنجليزية؟</p><div class="q" aria-hidden="true">${w[2]}</div><div class="opts">${opts.map(o=>`<button class="opt en" data-a="pick" data-v="${o[0]}">${o[0]}</button>`).join("")}</div>`;
 else if(t==="lp")body=`<p class="sub">استمع ثم اختر الصورة الصحيحة</p><button class="q" data-a="say" data-v="${w[0]}" aria-label="استمع إلى الكلمة">🔊</button><div class="opts emo">${opts.map(o=>`<button class="opt" data-a="pick" data-v="${o[0]}">${o[2]}</button>`).join("")}</div>`;
 else body=`<p class="sub">رتّب الحروف لتكتب الكلمة</p><div class="q" aria-hidden="true">${w[2]}</div><div class="slots" id="sl">${[...w[0]].map(()=>"<b>&nbsp;</b>").join("")}</div><div class="opts">${sh([...w[0]].map((c,i)=>i)).map(i=>`<button class="opt en" data-a="tile" data-v="${i}">${w[0][i]}</button>`).join("")}</div>`;
 h(head()+body+`<div id="fb"></div>`);if(t==="lp")setTimeout(()=>say(w[0]),300)}
function fin(ok){
 const c=Q.c,w=c.w,k=K(w),r=S.w[k]=S.w[k]||{b:0,c:0,x:0,t:0,lt:""},old=r.b;c.done=true;r.t=Date.now();
 let rw="",hint="";
 if(ok){r.c++;r.lt="";r.b=Math.min(4,r.b+1);Q.ok++;if(r.b>old)Q.imp++;S.lv++;rw="+1 🍃";if(old<3&&r.b>=3){S.lv+=5;rw="🎉 كلمة متقنة جديدة! +6 🍃"}good()}
 else{r.x++;r.lt=c.t;r.b=Math.max(0,r.b-1);bad();hint=`💡 تلميح: تبدأ بحرف «${[...w[0]][0].toUpperCase()}» وفيها ${[...w[0]].length} حروف · 🗣️ ${w[3]}<br>سنعيد الكلمة بعد قليل بتمرين مختلف.<br>`;
  if(!Q.req[k]){Q.req[k]=1;Q.L.splice(Math.min(Q.i+4,Q.L.length),0,w)}}
 if(S.d!==today()){S.d=today();S.dq=0}S.q++;S.dq++;save();
 document.getElementById("fb").innerHTML=`<div class="fb ${ok?"good":"bad"}"><b>${ok?"🐵 رائع! أحسنت! "+rw:"🐵 لا بأس، المحاولة تعلّم!"}</b><br>${hint}<span class="en">${w[0]}</span> = ${w[1]} · 🗣️ ${w[3]}<br><span class="en">${ex(w)}</span></div><button class="btn" data-a="next">التالي ▶</button>`;

 <div class="kiki"><span class="av" aria-hidden="true">🐵</span><p>${acc>=.85?"أنت بطل الغابة!":"كل مرة تتحسّن أكثر. سأذكّرك بالكلمات الصعبة لاحقًا."}${nu.length?"<br>🔓 المناطق المفتوحة: "+nu.join("، "):""}</p></div>

const act={

  toast(!SP?"هذا المتصفح لا يدعم نطق الكلمات. تعمل المؤثرات القصيرة فقط، ويظهر النطق مكتوبًا بالعربية 🗣️.":findV()?"إن لم تسمع الكلمة فارفع صوت الوسائط في الهاتف.":"لا يوجد في هاتفك صوت للغة المختارة. ثبّت «خدمات الكلام من Google» وحمّل صوت هذه اللغة من إعدادات تحويل النص إلى كلام. وفي الأثناء ستجد النطق مكتوبًا بالعربية 🗣️ تحت كل كلمة.")},
 async upd(){
  if(!navigator.onLine){toast("يلزم اتصال بالإنترنت للتحديث.");return}

   if(window.caches){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}

 lang(v){setL(v);save();S.intro?home():intro()},langs:langScreen,

 mute(){S.mute=!S.mute;save();try{speechSynthesis.cancel()}catch(e){}document.querySelectorAll("[data-a=mute]").forEach(b=>{b.textContent=S.mute?"🔇":"🔊";b.setAttribute("aria-label",S.mute?"تشغيل الصوت":"كتم الصوت")})},
 play:v=>play(v),share,say:v=>say(v),go(){ask(Q.c.w)},next(){Q.i++;nextQ()},
 pick(v){const c=Q.c;if(c.done)return;const ok=v===c.w[0];
  document.querySelectorAll(".opt").forEach(b=>{if(b.dataset.v===c.w[0])b.classList.add("good");else if(b.dataset.v===v&&!ok)b.classList.add("bad")});fin(ok)},
 tile(v){const c=Q.c;if(c.done)return;const b=document.querySelector(`.opt[data-v="${v}"]`),ch=c.w[0][v];
  if(ch===c.w[0][c.pos]){document.querySelectorAll("#sl b")[c.pos].textContent=ch;c.pos++;b.disabled=true;tone(520,.08);if(c.pos===c.w[0].length)fin(c.mis<=1)}
  else{c.mis++;bad();b.classList.add("shake");setTimeout(()=>b.classList.remove("shake"),300)}},
 pause(){h(`<div class="top"><button class="btn s" data-a="quit" aria-label="رجوع إلى الرئيسية">↩</button></div><h1>⏸ استراحة</h1><button class="btn" data-a="resume">متابعة ▶</button><button class="btn s" data-a="quit" style="width:100%">خروج إلى الرئيسية</button>`)},
 resume(){const c=Q.c;if(!c)return nextQ();c.card?card(c.w):c.done?act.next():ask(c.w)},
 quit(){Q=null;home()}};
$.onclick=e=>{const b=e.target.closest("[data-a]");if(b&&act[b.dataset.a]){if(["play","map","info","pause"].includes(b.dataset.a))try{history.pushState({},"")}catch(x){}act[b.dataset.a](b.dataset.v)}};
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
if(LG[S.l])setL(S.l);langScreen();window.onpopstate=()=>{Q=null;if(R)home()};
